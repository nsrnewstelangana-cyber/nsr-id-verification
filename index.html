<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSR News & Research - ID Verification</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#17213b;
}
.header{
    background:#071d45;
    padding:22px;
    text-align:center;
}
.header img{
    width:220px;
    max-width:80%;
}
.container{
    max-width:600px;
    margin:35px auto;
    padding:20px;
}
.card{
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}
.title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;
}
.verified{
    background:#e8f8ee;
    color:#087b35;
    border:2px solid #18a957;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}
.error{
    background:#fff0f0;
    color:#c00000;
    border:2px solid #d00000;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}
.info{
    line-height:1.8;
    font-size:17px;
}
.label{
    font-weight:bold;
}
.footer{
    margin-top:25px;
    text-align:center;
    color:#666;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <img src="nsr-logo.png" alt="NSR News & Research">
</div>

<div class="container">
<div class="card">

<div class="title">
MEDIA IDENTIFICATION VERIFICATION
</div>

<div id="result"></div>

<div class="footer">
NSR NEWS & RESEARCH<br>
9059491638 | 9908759929<br>
nsrnewstelangana@gmail.com
</div>

</div>
</div>

<script>

const journalists = {

"NSR 0220001": {
name:"Racharla Gopi",
designation:"Chief Editor",
organisation:"NSR NEWS & RESEARCH",
area:"Warangal, Telangana",
phone:"9059491638",
valid:"31-12-2026",
status:"ACTIVE"
},

"NSR 0220002": {
name:"Reporter Name",
designation:"Reporter",
organisation:"NSR NEWS & RESEARCH",
area:"Warangal, Telangana",
phone:"9908759929",
valid:"31-12-2026",
status:"ACTIVE"
},

"NSR 0220003": {
name:"GILIGITHA RAJINI",
designation:"SUB-EDITOR",
organisation:"NSR NEWS",
area:"Warangal, Telangana",
phone:"9908759929",
valid:"31-12-2026",
status:"ACTIVE"
}

};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const result = document.getElementById("result");

if(!id){

result.innerHTML =
`<div class="error">
ID NUMBER NOT PROVIDED
<br><br>
Please scan a valid NSR Journalist ID QR Code.
</div>`;

}

else if(!journalists[id]){

result.innerHTML =
`<div class="error">
❌ ID NOT VERIFIED
<br><br>
Employee ID: <b>${id}</b>
<br><br>
This ID was not found in the NSR verification system.
</div>`;

}

else{

const p = journalists[id];

if(p.status === "ACTIVE"){

result.innerHTML =
`
<div class="verified">
✓ VERIFIED JOURNALIST
</div>

<div class="info">

<b>NAME:</b> ${p.name}<br>

<b>DESIGNATION:</b> ${p.designation}<br>

<b>ORGANISATION:</b> ${p.organisation}<br>

<b>EMPLOYEE ID:</b> ${id}<br>

<b>AREA:</b> ${p.area}<br>

<b>CONTACT:</b> ${p.phone}<br>

<b>VALID UP TO:</b> ${p.valid}<br>

<b>STATUS:</b> ${p.status}

</div>
`;

}

else{

result.innerHTML =
`
<div class="error">
❌ ID NOT ACTIVE
<br><br>
Employee ID: <b>${id}</b>
</div>
`;

}

}

</script>

</body>
</html>
